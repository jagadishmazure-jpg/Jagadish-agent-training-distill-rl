# Offline CI: lint, tests, real test count, doc drift, brand check and a full-history secret scan.
# CPU only. torch comes from the official CPU wheel index (no CUDA download, no GPU needed).
# Actions are pinned to commit SHAs (Dependabot bumps them).
name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13", cache: pip }
      - name: Install (CPU torch wheel, then the package with dev extras)
        run: |
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Test count (printed, not swallowed)
        run: python scripts/count_tests.py
      - name: Demo
        run: distillrl demo
      - name: README and docs numbers match a fresh run
        run: python scripts/render_docs.py --check
      - name: Brand check (hashed blocklist)
        run: python scripts/check_brands.py

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
