[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-training-distill-rl"
version = "0.1.0"
description = "CPU-only agent training lab: teacher-student distillation of tool calls, DPO, GRPO with a reward-hacking guard, and int8 vs fp32 serving"
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
dependencies = ["numpy==2.1.3", "scikit-learn==1.9.1", "scipy==1.18.1", "torch==2.5.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.1"]

[project.scripts]
distillrl = "distillrl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S105", "S106", "S311", "S301", "S403"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"scripts/*" = ["S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
